<!-- Kuri gahunda y'Imyandikire n'Imiterere (CSS Styles) -->
<style>
    /* Ibi bintu bihindura imyandikire y'imyanya yose yuzuzwamo amakuru */
    .form-container { 
        flex: 1; 
        min-width: 350px; 
        background: white; 
        padding: 30px; 
        border-radius: 16px; 
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        border: 1px solid #e2e8f0; 
        height: fit-content; 
    }
    
    .form-title { 
        font-size: 22px; 
        font-weight: 700; 
        margin-bottom: 20px; 
        color: #0f172a; 
        letter-spacing: -0.5px;
    }

    .form-group { 
        margin-bottom: 18px; 
        display: flex; 
        flex-direction: column; 
        gap: 6px; 
    }
    
    .form-group label { 
        font-size: 13.5px; 
        font-weight: 600; 
        color: #475569; 
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    /* Uburyo bugezweho bwa Text Input (Modern Text Style) */
    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="date"] { 
        padding: 12px 14px; 
        border: 1px solid #cbd5e1; 
        border-radius: 8px; 
        font-size: 15px; 
        color: #334155;
        background-color: #f8fafc;
        outline: none; 
        transition: all 0.2s ease-in-out;
    }
    
    /* Iyo umukiriya akanze muri input ngo yandike, ihita ihinduka neza */
    .form-group input:focus { 
        border-color: #2563eb; 
        background-color: #ffffff;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15); 
    }

    /* Uburyo bugezweho bwo guhitamo Igitsina (Radio Buttons Style) */
    .gender-options {
        display: flex;
        gap: 20px;
        margin-top: 4px;
    }

    .gender-label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-size: 15px !important;
        font-weight: 500 !important;
        color: #334155 !important;
        text-transform: none !important;
    }

    .gender-label input[type="radio"] {
        width: 18px;
        height: 18px;
        accent-color: #2563eb; /* Ihita iba ubururu iyo bayikande */
        cursor: pointer;
    }

    .row-inputs { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        gap: 12px; 
    }
</style>

<!-- Hano ni muri HTML aho Ifomu iherereye -->
<div class="form-container">
    <div class="form-title">Fomu yo Guza Application</div>
    
    <div class="selected-service-info">
        <p><strong>Serivisi:</strong> <span id="display-service">Nta yatoranyijwe</span></p>
        <p style="color: #16a34a; font-weight: bold; margin-top: 4px;">Igiciro: <span id="display-price">0 RWF</span></p>
    </div>

    <form id="applicationForm">
        <div class="form-group">
            <label>Amazina (Full Name)</label>
            <input type="text" id="fullname" placeholder="Urugero: Keza Alice" required>
        </div>

        <div class="form-group">
            <label>Telefoni (MoMo)</label>
            <input type="text" id="phone" placeholder="07xxxxxxxx" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="urugero@gmail.com" required>
        </div>

        <!-- GUSHIRAHO ITARIKI Y'AMAVUKO -->
        <div class="form-group">
            <label>Itariki y'amavuko (Date of Birth)</label>
            <input type="date" id="dob" required>
        </div>

        <!-- GUHITAMO GENDER NEZA (MALE / FEMALE) -->
        <div class="form-group">
            <label>Igitsina (Gender)</label>
            <div class="gender-options">
                <label class="gender-label">
                    <input type="radio" name="gender" value="Male" required> Gabo (Male)
                </label>
                <label class="gender-label">
                    <input type="radio" name="gender" value="Female" required> Gore (Female)
                </label>
            </div>
        </div>

        <div class="row-inputs">
            <div class="form-group">
                <label>Akarere</label>
                <input type="text" id="district" placeholder="Akarere" required>
            </div>
            <div class="form-group">
                <label>Umurenge</label>
                <input type="text" id="sector" placeholder="Umurenge" required>
            </div>
        </div>

        <div class="row-inputs">
            <div class="form-group">
                <label>Akagari</label>
                <input type="text" id="cell" placeholder="Akagari" required>
            </div>
            <div class="form-group">
                <label>Umudugudu</label>
                <input type="text" id="village" placeholder="Umudugudu" required>
            </div>
        </div>

        <button type="submit" class="btn-submit">Ohereza Application</button>
    </form>
</div>
